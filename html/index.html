<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vanguard Jobs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="portal" class="portal" hidden>
        <div class="device" role="dialog" aria-label="Job Portal">
            <span class="camera" aria-hidden="true"></span>
            <div class="screen">
                <header class="status-bar">
                    <div class="brand">
                        <span class="brand-mark" id="brand-mark">V</span>
                        <span class="brand-text"><strong id="brand-title">VANGUARD</strong><small id="brand-subtitle">JOBS</small></span>
                    </div>
                    <span class="status-center" id="center-label">Job Center</span>
                    <div class="status-right">
                        <span class="clock" id="clock">00:00</span>
                        <button class="icon-btn" id="close" type="button" aria-label="Close">
                            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
                        </button>
                    </div>
                </header>
                <div class="layout">
                    <aside class="team" id="team"></aside>
                    <main class="main" id="main"></main>
                </div>
                <div class="toasts" id="toasts" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <div id="tracker" class="tracker" hidden></div>

    <script src="app.js"></script>
</body>
</html>
